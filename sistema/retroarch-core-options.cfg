# Opciones de los emuladores para TeleVieja OS.
# Pensadas para una netbook con Atom: priorizan que el juego vaya a velocidad normal.

# --- PlayStation (PCSX ReARMed) ---
# Recompilador: traduce el código de la PS1 al del Atom (mucho más rápido).
pcsx_rearmed_drc = "enabled"
# Si no llega, saltea cuadros en vez de ponerse lento (en la tele casi no se nota).
pcsx_rearmed_frameskip_type = "auto"
# El sonido en otro hilo: aprovecha el segundo núcleo "virtual" del Atom.
pcsx_rearmed_spu_thread = "enabled"
# Sin eco de sonido: ahorra procesador.
pcsx_rearmed_spu_reverb = "disabled"
# Saltea el logo de la PlayStation al arrancar.
pcsx_rearmed_show_bios_bootlogo = "disabled"
