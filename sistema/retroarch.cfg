# RetroArch para TeleVieja OS. @RAIZ@ lo reemplaza instalar.sh.
config_save_on_exit = "false"

# Video: pixeles enteros, sin suavizar; en la tele de tubo queda como la consola original.
video_driver = "gl"
video_fullscreen = "true"
video_windowed_fullscreen = "true"
video_vsync = "true"
video_smooth = "false"
video_scale_integer = "true"
video_aspect_ratio_auto = "true"
video_threaded = "false"
video_shader_enable = "false"
video_font_size = "28"

# Audio
audio_driver = "alsa"
audio_latency = "96"

# Menú liviano
menu_driver = "rgui"
menu_show_load_content_animation = "false"
pause_nonactive = "false"
rewind_enable = "false"
input_autodetect_enable = "false"

# Carpetas
savefile_directory = "@RAIZ@/Partidas"
savestate_directory = "@RAIZ@/Partidas"
system_directory = "@RAIZ@/BIOS"
screenshot_directory = "@RAIZ@/Partidas"
libretro_info_path = "/usr/share/libretro/info"

# Teclado: Esc sale, F1 abre el menú de RetroArch
input_exit_emulator = "escape"
input_menu_toggle = "f1"
input_save_state = "f2"
input_load_state = "f4"

# Para el control desde el celular: RetroArch acepta órdenes (salir, pausa, guardar)
# por la red de la casa en el puerto 55355.
network_cmd_enable = "true"
network_cmd_port = "55355"
