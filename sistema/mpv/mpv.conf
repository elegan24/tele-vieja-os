# mpv para TeleVieja OS (netbook vieja + tele de tubo)

fullscreen=yes
# xv es lo más liviano en las Intel viejas; si no anda prueba gpu y después x11.
vo=xv,gpu,x11
hwdec=no
framedrop=vo
cursor-autohide=always
osc=no
ytdl=no
msg-level=all=warn

# Audio: la tele tiene una sola entrada (mono), así que mezclamos a estéreo.
audio-channels=stereo
volume=100
volume-max=130

# Letras grandes y lejos del borde (la tele de tubo corta los bordes).
osd-font-size=40
osd-margin-x=46
osd-margin-y=30
osd-border-size=3
sub-font-size=52
sub-margin-y=40
sub-border-size=3
sub-auto=fuzzy

# Si un video en HD va lento, descomentá esto (baja un poco la calidad, en la tele no se nota):
#vd-lavc-skiploopfilter=all
#vd-lavc-fast=yes
