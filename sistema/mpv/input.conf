# Teclado mientras se ve un video
ESC quit
BS quit
ENTER cycle pause
SPACE cycle pause
PGUP playlist-prev
PGDWN playlist-next
UP add volume 5
DOWN add volume -5

# Controles remotos USB ("air mouse" de los TV Box)
GO_BACK quit
HOMEPAGE quit
STOP quit
PLAYPAUSE cycle pause
PLAY cycle pause
PAUSE cycle pause
NEXT playlist-next
PREV playlist-prev
MENU show-text "${media-title}" 3000
CHANNEL_UP playlist-next
CHANNEL_DOWN playlist-prev

# El "mouse" del control no tiene que sacar el video de pantalla completa
MBTN_LEFT ignore
MBTN_LEFT_DBL ignore
MBTN_RIGHT ignore
WHEEL_UP ignore
WHEEL_DOWN ignore
